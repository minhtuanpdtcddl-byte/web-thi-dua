<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới Thiệu Hệ Thống Quản Lý Đoàn Viên</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .hero-banner {
      background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
      color: white;
      padding: 90px 20px;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }
    .card-custom {
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .card-custom:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body class="bg-light">

  <!-- Header / Hero Section -->
  <div class="hero-banner text-center">
    <div class="container">
      <h1 id="HERO_TITLE" class="display-4 fw-bold">Đang tải...</h1>
      <p id="HERO_SUBTITLE" class="lead mt-3 mx-auto" style="max-width: 700px;"></p>
      
      <div class="mt-4">
        <button onclick="goToMainApp()" class="btn btn-warning btn-lg px-4 py-2 fw-bold shadow">
          🚀 Vào Trang Chủ Hệ Thống
        </button>
      </div>
    </div>
  </div>

  <!-- Thông tin giới thiệu -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-9">
        <div class="card card-custom p-4">
          <h3 class="card-title text-primary fw-bold text-center mb-3">Về Hệ Thống</h3>
          <p id="ABOUT_TEXT" class="text-secondary fs-5 text-center leading-relaxed">
            Đang tải dữ liệu giới thiệu...
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Khi mở trang, gọi backend lấy dữ liệu cấu hình
    window.onload = function() {
      google.script.run
        .withSuccessHandler(renderPage)
        .withFailureHandler(function(err){ alert('Lỗi tải dữ liệu: ' + err.message); })
        .getLandingPageConfig();
    };

    function renderPage(config) {
      if (config) {
        if(config.HERO_TITLE) document.getElementById('HERO_TITLE').innerText = config.HERO_TITLE;
        if(config.HERO_SUBTITLE) document.getElementById('HERO_SUBTITLE').innerText = config.HERO_SUBTITLE;
        if(config.ABOUT_TEXT) document.getElementById('ABOUT_TEXT').innerText = config.ABOUT_TEXT;
      }
    }

    function goToMainApp() {
      // Chuyển sang Trang chủ bằng tham số ?page=home
      window.location.href = "<?= ScriptApp.getService().getUrl() ?>?page=home";
    }
  </script>
</body>
</html>
