<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - Đoàn Trường</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- 1. BẢNG ĐĂNG NHẬP (LOGIN) -->
    <div id="loginBox" class="flex justify-center items-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <i class="fa-solid fa-user-shield text-4xl text-blue-800 mb-2"></i>
                <h2 class="text-2xl font-bold text-blue-900">ĐĂNG NHẬP QUẢN TRỊ</h2>
                <p class="text-xs text-slate-500 mt-1">Hệ thống Cấu hình Thi đua Đoàn trường</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-2">Mật khẩu Quản trị</label>
                    <input type="password" id="adminPassword" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập mật khẩu (Lưu ở ô F2 trên Sheet)" required>
                </div>
                <button type="submit" id="btnLogin" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 rounded-lg transition">
                    ĐĂNG NHẬP
                </button>
            </form>
        </div>
    </div>

    <!-- 2. BẢNG CẤU HÌNH ADMIN (ẨN MẶC ĐỊNH) -->
    <div id="adminPanel" class="hidden container mx-auto p-4 max-w-4xl my-8">
        <div class="bg-blue-900 text-white p-4 rounded-t-xl flex justify-between items-center shadow">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-sliders mr-2"></i> BẢNG CẤU HÌNH HỆ THỐNG</h1>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs font-semibold transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
            </button>
        </div>

        <div class="bg-white p-6 rounded-b-xl shadow-lg border-x border-b border-slate-200 space-y-6">
            
            <!-- THÔNG TIN ĐƠN VỊ -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-blue-900 text-base mb-3"><i class="fa-solid fa-building mr-1"></i> Thông tin Đơn vị</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Tên Trường / Đoàn Trường (Ô B1)</label>
                        <input type="text" id="cfgSchoolName" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">URL Logo Trường (Ô B2)</label>
                        <input type="text" id="cfgLogoUrl" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Dán link ảnh tại đây">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Thông báo chạy ở trang chủ (Ô B3)</label>
                    <textarea id="cfgAnnouncement" rows="2" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
            </div>

            <!-- DANH SÁCH HOẠT ĐỘNG -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-blue-900 text-base mb-2"><i class="fa-solid fa-list-check mr-1"></i> Danh sách Hoạt động Đoàn (Cột E)</h3>
                <p class="text-xs text-slate-500 mb-2">Mỗi tên Hoạt động nằm trên **01 dòng riêng biệt**:</p>
                <textarea id="cfgActivities" rows="5" class="w-full p-2.5 border rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- BẢO MẬT -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-blue-900 text-base mb-2"><i class="fa-solid fa-key mr-1"></i> Đổi mật khẩu Admin (Ghi vào ô F2)</h3>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Mật khẩu Mới</label>
                    <input type="password" id="cfgNewPassword" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Để trống nếu không muốn đổi mật khẩu">
                </div>
            </div>

            <!-- NÚT LƯU -->
            <div class="pt-2">
                <button type="button" onclick="saveConfig()" id="btnSave" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> LƯU THAY ĐỔI CẤU HÌNH
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ THAY LINK WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvWVoa65yJSlsyLkxDdDr9SirYRUvAC5Ciwj-jSkasSH17g7z2k0vj_V4pETeOzFhX/exec"; 

        let currentPassword = "";

        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value.trim();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerText = "⏳ Đang xác thực...";

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "adminLogin", password: pass })
                });
                const data = await res.json();

                if (data.status === "success") {
                    currentPassword = pass;
                    loadConfigToForm(data.config);
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('adminPanel').classList.remove('hidden');
                } else {
                    alert("❌ " + data.message);
                }
            } catch (err) {
                alert("❌ Lỗi kết nối tới máy chủ: " + err);
            } finally {
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";
            }
        }

        function loadConfigToForm(cfg) {
            document.getElementById('cfgSchoolName').value = cfg.schoolName || '';
            document.getElementById('cfgLogoUrl').value = cfg.logoUrl || '';
            document.getElementById('cfgAnnouncement').value = cfg.announcement || '';
            
            if (Array.isArray(cfg.activities)) {
                document.getElementById('cfgActivities').value = cfg.activities.join('\n');
            }
        }

        async function saveConfig() {
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.innerText = "⏳ Đang lưu cấu hình lên Google Sheet...";

            const newPass = document.getElementById('cfgNewPassword').value.trim();
            const activitiesText = document.getElementById('cfgActivities').value;
            const activitiesArray = activitiesText.split('\n').map(a => a.trim()).filter(a => a !== '');

            const updatedConfig = {
                schoolName: document.getElementById('cfgSchoolName').value.trim(),
                logoUrl: document.getElementById('cfgLogoUrl').value.trim(),
                announcement: document.getElementById('cfgAnnouncement').value.trim(),
                activities: activitiesArray
            };

            if (newPass !== "") {
                updatedConfig.admin_password = newPass;
            }

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "updateConfig",
                        password: currentPassword,
                        newConfig: updatedConfig
                    })
                });
                const data = await res.json();

                if (data.status === "success") {
                    alert("🎉 " + data.message);
                    if (newPass !== "") currentPassword = newPass;
                    document.getElementById('cfgNewPassword').value = "";
                } else {
                    alert("❌ " + data.message);
                }
            } catch (err) {
                alert("❌ Không thể lưu cấu hình: " + err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> LƯU THAY ĐỔI CẤU HÌNH';
            }
        }

        function logout() {
            currentPassword = "";
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('adminPassword').value = "";
        }
    </script>
</body>
</html>
